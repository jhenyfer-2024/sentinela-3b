<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedFlow Kids - Triagem</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f8ff, #f3fff5);
      color: #37474f;
    }

    .container {
      max-width: 1050px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      margin-bottom: 18px;
      background: white;
      border: 2px solid #b3e5fc;
      border-radius: 8px;
      box-shadow: 0 5px 18px rgba(33,150,243,.10);
    }

    .titulo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #4fc3f7;
      border-radius: 8px;
      font-size: 31px;
    }

    .titulo h2 {
      margin: 0;
      color: #0277bd;
      font-size: 24px;
    }

    .titulo p {
      margin: 5px 0 0;
      color: #78909c;
      font-size: 13px;
    }

    .btn-abrir-tv,
    .btn-tv {
      background: #26a69a;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 11px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-abrir-tv:hover,
    .btn-tv:hover {
      background: #168f84;
    }

    .pacientes-fila {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border: 2px solid #b3e5fc;
      border-radius: 8px;
      box-shadow: 0 5px 18px rgba(33,150,243,.08);
    }

    .fila-titulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .fila-titulo h3 {
      margin: 0;
      color: #0277bd;
      font-size: 18px;
    }

    .fila-titulo span {
      background: #e8f5e9;
      color: #388e3c;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
    }

    .fila-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 15px;
      margin-bottom: 8px;
      background: #f8fdff;
      border: 1px solid #cceaf7;
      border-left: 5px solid #4fc3f7;
      border-radius: 6px;
    }

    .paciente-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .paciente-icone {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e1f5fe;
      border-radius: 6px;
      font-size: 22px;
    }

    .fila-item strong {
      display: block;
      color: #0277bd;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .fila-item small {
      color: #78909c;
      font-size: 12px;
    }

    .btn-atualizar {
      margin-top: 6px;
      background: #90caf9;
      color: #075985;
      border: none;
      border-radius: 5px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .triagem-box {
      background: white;
      padding: 22px;
      border: 2px solid #c8e6c9;
      border-radius: 8px;
      box-shadow: 0 5px 18px rgba(76,175,80,.08);
    }

    .triagem-titulo {
      margin: 0 0 20px;
      color: #43a047;
      font-size: 20px;
      border-bottom: 2px solid #e8f5e9;
      padding-bottom: 12px;
    }

    .campo {
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      margin-bottom: 6px;
      color: #546e7a;
      font-size: 13px;
      font-weight: bold;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e1f5fe;
      border-radius: 6px;
      background: #fafdff;
      color: #37474f;
      font-size: 14px;
      outline: none;
    }

    .campo input:focus,
    .campo select:focus,
    .campo textarea:focus {
      background: white;
      border-color: #4fc3f7;
    }

    .campo textarea {
      min-height: 100px;
      resize: vertical;
    }

    .campos-duplos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn-ia-risco {
      width: 100%;
      margin: 15px 0;
      padding: 14px;
      background: #7e57c2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .btn-ia-risco:hover {
      background: #673ab7;
      transform: translateY(-2px);
    }

    .btn-ia-risco:disabled {
      opacity: .7;
      cursor: wait;
      transform: none;
    }

    #analise-ia {
      display: none;
      margin: 15px 0;
      padding: 18px;
      border: 2px solid #d1c4e9;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 15px;
    }

    #resultado {
      padding: 12px;
      margin: 15px 0;
      text-align: center;
      border-radius: 6px;
      font-weight: bold;
      text-transform: uppercase;
    }

    #resultado:empty {
      display: none;
    }

    #resultado.verde {
      background: #e8f5e9;
      color: #2e7d32;
      border: 2px solid #c8e6c9;
    }

    #resultado.amarelo {
      background: #fff8e1;
      color: #f57f17;
      border: 2px solid #ffe082;
    }

    #resultado.vermelho {
      background: #ffebee;
      color: #c62828;
      border: 2px solid #ffcdd2;
    }

    .btn-salvar {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #43a047;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .btn-salvar:hover {
      background: #388e3c;
      transform: translateY(-2px);
    }

    .aviso-seguranca {
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      background: #fff8e1;
      color: #795548;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 650px) {
      .cabecalho {
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
      }

      .btn-abrir-tv,
      .btn-tv {
        width: 100%;
      }

      .fila-titulo {
        flex-direction: column;
        align-items: flex-start;
      }

      .fila-item {
        flex-direction: column;
        align-items: stretch;
      }

      .campos-duplos {
        grid-template-columns: 1fr;
      }

      .container {
        margin: 12px auto;
        padding: 0 10px;
      }

      .triagem-box,
      .pacientes-fila {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <!-- CABEÇALHO -->
  <div class="cabecalho">
    <div class="titulo">
      <div class="logo">🧸</div>
      <div>
        <h2>🩺 MedFlow Kids</h2>
        <p>Triagem e acolhimento infantil</p>
      </div>
    </div>

    <button
      type="button"
      class="btn-abrir-tv"
      onclick="window.open('tv.html', '_blank')">
      📺 Abrir Tela da TV
    </button>
  </div>

  <!-- FILA DE PACIENTES -->
  <div class="pacientes-fila">
    <div class="fila-titulo">
      <h3>🧸 Pacientes aguardando triagem</h3>
      <span>📺 Chamar no guichê</span>
    </div>

    <div id="fila-pacientes">
      <p style="color:#78909c;text-align:center;">
        🧸 Carregando pacientes...
      </p>
    </div>

    <button
      type="button"
      class="btn-atualizar"
      onclick="carregarPacientes()">
      🔄 Atualizar lista
    </button>
  </div>

  <!-- FORMULÁRIO DE TRIAGEM -->
  <div class="triagem-box">
    <h3 class="triagem-titulo">
      🩺 Formulário de Triagem Infantil
    </h3>

    <div class="campo">
      <label for="nome">👤 Nome do paciente</label>
      <input
        id="nome"
        placeholder="Digite o nome da criança">
    </div>

    <div class="campo">
      <label for="sintoma">🩺 Sintoma principal</label>
      <select id="sintoma">
        <option value="">Selecione o sintoma</option>
        <option value="dor_leve">🤕 Dor leve</option>
        <option value="resfriado">🤧 Resfriado</option>
        <option value="coriza">🤧 Coriza</option>
        <option value="tosse">😷 Tosse</option>
        <option value="febre">🌡️ Febre</option>
        <option value="vomito">🤢 Vômito</option>
        <option value="diarreia">💧 Diarreia</option>
        <option value="falta_ar_moderada">🫁 Falta de ar moderada</option>
        <option value="falta_ar_grave">🫁 Falta de ar grave</option>
        <option value="infarto">🚨 Suspeita de infarto</option>
        <option value="avc">
