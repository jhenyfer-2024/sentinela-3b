
<script>
/*
 * CONFIGURAÇÃO
 *
 * Se o backend estiver em outro endereço, coloque a URL dele abaixo,
 * sem a barra final. Exemplo: https://seu-backend.onrender.com
 *
 * Se estiver no mesmo domínio, deixe vazio.
 */
const API_BASE_URL = "";

function apiUrl(caminho) {
  return API_BASE_URL.replace(/\/+$/, "") + caminho;
}

/* LER A RESPOSTA SEM QUEBRAR QUANDO O SERVIDOR RETORNAR HTML */

async function lerResposta(resposta) {
  const texto = await resposta.text();
  let dados;

  try {
    dados = texto ? JSON.parse(texto) : {};
  } catch {
    if (resposta.status === 404) {
      throw new Error(
        "Rota não encontrada (404). Verifique se o backend possui esse endereço."
      );
    }

    throw new Error(
      "O servidor retornou uma página HTML ou uma resposta inválida, " +
      "em vez de JSON. Verifique a URL e se a rota existe."
    );
  }

  if (!resposta.ok) {
    throw new Error(
      dados.erro || dados.message ||
      "Erro do servidor (HTTP " + resposta.status + ")."
    );
  }

  return dados;
}

/* CARREGAR PACIENTES */

async function carregarPacientes() {
  const div = document.getElementById("fila-pacientes");

  try {
    const resposta = await fetch(apiUrl("/pacientes"), {
      headers: { Accept: "application/json" }
    });

    const dados = await lerResposta(resposta);

    const pacientes = Array.isArray(dados)
      ? dados
      : dados.pacientes;

    if (!Array.isArray(pacientes)) {
      throw new Error(
        "A rota /pacientes precisa retornar uma lista de pacientes em JSON."
      );
    }

    const fila = pacientes.filter(p => p.status === "triagem");
    div.replaceChildren();

    if (fila.length === 0) {
      const mensagem = document.createElement("p");
      mensagem.style.cssText =
        "text-align:center;padding:20px;color:#78909c";
      mensagem.textContent = "🧸 Nenhum paciente aguardando triagem.";
      div.appendChild(mensagem);
      return;
    }

    fila.forEach(p => {
      const item = document.createElement("div");
      item.className = "fila-item";

      const info = document.createElement("div");
      info.className = "paciente-info";

      const icone = document.createElement("div");
      icone.className = "paciente-icone";
      icone.textContent = "🧸";

      const detalhes = document.createElement("div");
      const nome = document.createElement("strong");
      nome.textContent = p.nome || "Paciente";

      const pequeno = document.createElement("small");
      pequeno.textContent =
        "CPF: " + (p.cpf || "—") +
        " | Tipo: " + (p.tipo || "—");

      detalhes.append(nome, pequeno);
      info.append(icone, detalhes);

      const botao = document.createElement("button");
      botao.type = "button";
      botao.className = "btn-tv";
      botao.textContent = "📺 Chamar na TV";
      botao.addEventListener("click", () => chamarNaTV(p.nome));

      item.append(info, botao);
      div.appendChild(item);
    });

  } catch (erro) {
    div.replaceChildren();

    const mensagem = document.createElement("p");
    mensagem.style.cssText = "color:#e53935;text-align:center";
    mensagem.textContent = "❌ " + erro.message;
    div.appendChild(mensagem);
  }
}

/* CHAMAR PACIENTE NA TV */

async function chamarNaTV(nome) {
  if (!nome) {
    alert("Nome do paciente não informado.");
    return;
  }

  try {
    const resposta = await fetch(apiUrl("/tv/chamar"), {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Accept: "application/json"
      },
      body: JSON.stringify({
        localTipo: "GUICHÊ",
        localNumero: "01",
        paciente: nome
      })
    });

    await lerResposta(resposta);
    alert("✅ Solicitação de chamada enviada para a TV.");

  } catch (erro) {
    alert("❌ Não foi possível chamar o paciente: " + erro.message);
  }
}

/* CLASSIFICAÇÃO LOCAL SIMPLIFICADA
   Não é um protocolo clínico validado. */

function classificarRisco(sintoma, temperatura) {
  const vermelhos = [
    "infarto",
    "avc",
    "convulsao",
    "hemorragia",
    "falta_ar_grave"
  ];

  const amarelos = [
    "febre",
    "vomito",
    "diarreia",
    "falta_ar_moderada"
  ];

  if (vermelhos.includes(sintoma)) return "vermelho";
  if (temperatura !== null && temperatura >= 39) return "vermelho";
  if (amarelos.includes(sintoma)) return "amarelo";

  return "verde";
}

/* ANÁLISE COM IA */

async function gerarSugestaoRisco() {
  const sintoma = document.getElementById("sintoma").value;
  const temperaturaTexto = document.getElementById("temp").value;
  const alergia = document.getElementById("alergia").value.trim();
  const observacao = document.getElementById("observacao").value.trim();
  const painel = document.getElementById("analise-ia");
  const botao = document.getElementById("btn-ia-risco");

  if (!sintoma) {
    alert("Selecione o sintoma antes de solicitar a análise.");
    return;
  }

  let temperatura = null;

  if (temperaturaTexto !== "") {
    temperatura = Number(temperaturaTexto);

    if (!Number.isFinite(temperatura) ||
        temperatura < 30 || temperatura > 45) {
      alert("Digite uma temperatura válida.");
      return;
    }
  }

  painel.style.display = "block";
  painel.textContent = "🤖 Solicitando análise...";
  botao.disabled = true;
  botao.textContent = "⏳ Analisando...";

  try {
    const resposta = await fetch(apiUrl("/api/analisar-risco"), {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Accept: "application/json"
      },
      body: JSON.stringify({
        sintoma,
        temperatura,
        alergia,
        observacao
      })
    });

    const dados = await lerResposta(resposta);

    if (!dados || typeof dados !== "object") {
      throw new Error("A resposta da análise está vazia ou inválida.");
    }

    const classificacao = String(
      dados.classificacao || "indeterminada"
    ).toUpperCase();

    const sinais = Array.isArray(dados.sinais_atencao) &&
      dados.sinais_atencao.length
      ? dados.sinais_atencao.map(s => "• " + String(s)).join("\n")
      : "Nenhum sinal de atenção foi retornado.";

    painel.textContent =
      "🤖 SUGESTÃO PRELIMINAR\n\n" +
      "Classificação sugerida: " + classificacao + "\n\n" +
      "Explicação: " +
      String(dados.explicacao || "Não informada.") +
      "\n\nSinais de atenção:\n" + sinais +
      "\n\nAviso: " +
      String(dados.aviso ||
        "Esta análise não substitui avaliação de um profissional de saúde.");

  } catch (erro) {
    painel.textContent =
      "❌ Não foi possível concluir a análise.\n\n" +
      erro.message +
      "\n\nConfirme se o backend está ativo e se a rota " +
      "/api/analisar-risco está implementada.";

  } finally {
    botao.disabled = false;
    botao.textContent = "🤖 Analisar paciente com IA";
  }
}

/* SALVAR TRIAGEM */

async function salvar() {
  const nome = document.getElementById("nome").value.trim();
  const sintoma = document.getElementById("sintoma").value;
  const temperaturaTexto = document.getElementById("temp").value;
  const alergia = document.getElementById("alergia").value.trim();
  const observacao = document.getElementById("observacao").value.trim();
  const resultado = document.getElementById("resultado");
  const botao = document.querySelector(".btn-salvar");

  if (!nome) {
    alert("Digite o nome do paciente.");
    return;
  }

  if (!sintoma) {
    alert("Selecione o sintoma.");
    return;
  }

  let temperatura = null;

  if (temperaturaTexto !== "") {
    temperatura = Number(temperaturaTexto);

    if (!Number.isFinite(temperatura) ||
        temperatura < 30 || temperatura > 45) {
      alert("Digite uma temperatura válida.");
      return;
    }
  }

  const risco = classificarRisco(sintoma, temperatura);

  botao.disabled = true;
  botao.textContent = "⏳ Salvando...";

  try {
    const resposta = await fetch(apiUrl("/triagem"), {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Accept: "application/json"
      },
      body: JSON.stringify({
        nome,
        sintoma,
        temperatura,
        alergia,
        observacao,
        risco
      })
    });

    await lerResposta(resposta);

    resultado.className = risco;
    resultado.textContent =
      "Classificação preliminar: " + risco.toUpperCase();

    alert("✅ Triagem salva com sucesso!");

    document.getElementById("nome").value = "";
    document.getElementById("sintoma").value = "";
    document.getElementById("temp").value = "";
    document.getElementById("alergia").value = "";
    document.getElementById("observacao").value = "";

    const painel = document.getElementById("analise-ia");
    painel.style.display = "none";
    painel.textContent = "";

    await carregarPacientes();

  } catch (erro) {
    alert("❌ Não foi possível salvar: " + erro.message);

  } finally {
    botao.disabled = false;
    botao.textContent = "💚 Salvar Triagem";
  }
}

/* INICIALIZAÇÃO */

carregarPacientes();
setInterval(carregarPacientes, 10000);
</script>
