<script>
/* FUNÇÃO AUXILIAR: LER RESPOSTAS DO SERVIDOR */

async function lerResposta(resposta) {
  const texto = await resposta.text();
  let dados;

  try {
    dados = JSON.parse(texto);
  } catch {
    throw new Error(
      "O servidor não retornou JSON válido. Verifique se a rota existe, " +
      "se o endereço está correto e se o servidor está funcionando."
    );
  }

  if (!resposta.ok) {
    throw new Error(dados.erro || "O servidor apresentou um erro.");
  }

  return dados;
}

/* CARREGAR PACIENTES */

async function carregarPacientes() {
  const div = document.getElementById("fila-pacientes");

  try {
    const resposta = await fetch("/pacientes");
    const pacientes = await lerResposta(resposta);

    if (!Array.isArray(pacientes)) {
      throw new Error("O servidor não retornou uma lista válida.");
    }

    const fila = pacientes.filter(p => p.status === "triagem");
    div.replaceChildren();

    if (fila.length === 0) {
      div.innerHTML = `
        <div style="text-align:center;padding:25px;color:#90a4ae;">
          🧸 Nenhum pequeno paciente aguardando.
          <br>
          <small>A fila está tranquila! 💙</small>
        </div>
      `;
      return;
    }

    fila.forEach(p => {
      const item = document.createElement("div");
      item.className = "fila-item";

      const info = document.createElement("div");
      info.className = "paciente-info";

      const icone = document.createElement("div");
      icone.className = "paciente-icone";
      icone.textContent = "🧸";

      const detalhes = document.createElement("div");
      const nome = document.createElement("strong");
      nome.textContent = p.nome || "Paciente";

      const pequeno = document.createElement("small");
      pequeno.textContent =
        "CPF: " + (p.cpf || "—") +
        " | Tipo: " + (p.tipo || "—");

      detalhes.append(nome, pequeno);
      info.append(icone, detalhes);

      const botao = document.createElement("button");
      botao.type = "button";
      botao.className = "btn-tv";
      botao.textContent = "📺 Chamar na TV";

      botao.addEventListener("click", () => {
        chamarNaTV(p.nome);
      });

      item.append(info, botao);
      div.appendChild(item);
    });

  } catch (erro) {
    div.textContent = "";
    const mensagem = document.createElement("p");
    mensagem.style.color = "#e53935";
    mensagem.style.textAlign = "center";
    mensagem.textContent = "❌ " + erro.message;
    div.appendChild(mensagem);
  }
}

/* CHAMAR NA TV */

async function chamarNaTV(nome) {
  try {
    const resposta = await fetch("/tv/chamar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        localTipo: "GUICHÊ",
        localNumero: "01",
        paciente: nome
      })
    });

    await lerResposta(resposta);
    alert("✅ " + nome + " foi chamado na TV para o Guichê 01!");
  } catch (erro) {
    alert("❌ " + erro.message);
  }
}

/* CLASSIFICAÇÃO LOCAL E CÁLCULO DE RISCO */

function classificarRisco(sintoma, temperatura) {
  const vermelhos = [
    "infarto",
    "avc",
    "convulsao",
    "hemorragia",
    "falta_ar_grave"
  ];

  const amarelos = [
    "febre",
    "vomito",
    "diarreia",
    "falta_ar_moderada"
  ];

  if (vermelhos.includes(sintoma) || temperatura >= 39) return "vermelho";
  if (amarelos.includes(sintoma) || (temperatura >= 37.8 && temperatura < 39)) return "amarelo";
  return "verde";
}

/* ANALISAR PACIENTE COM SISTEMA LOCAL (SUBSTITUTO DA IA) */

function gerarSugestaoRisco() {
  const sintoma = document.getElementById("sintoma").value;
  const temperaturaTexto = document.getElementById("temp").value;
  const alergia = document.getElementById("alergia").value.trim();
  const observacao = document.getElementById("observacao").value.trim();

  const painel = document.getElementById("analise-ia");
  const botao = document.getElementById("btn-ia-risco");

  if (!sintoma) {
    alert("🩺 Selecione o sintoma antes de solicitar a análise.");
    return;
  }

  let temperatura = 0;
  if (temperaturaTexto !== "") {
    temperatura = Number(temperaturaTexto);
    if (!Number.isFinite(temperatura) || temperatura < 30 || temperatura > 45) {
      alert("Digite uma temperatura válida.");
      return;
    }
  }

  painel.style.display = "block";
  painel.textContent = "⚙️ Processando análise do quadro clínico...";

  // Simulando um pequeno delay para feedback visual
  setTimeout(() => {
    const risco = classificarRisco(sintoma, temperatura);
    
    let porcentagem = "15%";
    let explicacao = "Sintomas leves ou sem alterações térmicas significativas. O quadro aparenta estabilidade.";
    let causa = "Comum em infecções virais leves, resfriados comuns ou pequenas indisposições passageiras.";
    let classificacaoTexto = "VERDE (Pouco Urgente)";

    if (risco === "amarelo") {
      porcentagem = "55%";
      classificacaoTexto = "AMARELO (Urgente / Atenção)";
      explicacao = "A presença de febre moderada/alta ou sintomas gastrointestinais/respiratórios moderados exige acompanhamento de perto para evitar desidratação ou agravamento.";
      causa = "Geralmente associada a processos inflamatórios, viroses ativas, infecções leves a moderadas ou reações alérgicas.";
    } else if (risco === "vermelho") {
      porcentagem = "95%";
      classificacaoTexto = "VERMELHO (Emergência / Muito Grave)";
      explicacao = "O quadro apresenta sinais críticos de alerta (como risco respiratório, neurológico ou hemodinâmico) que demandam atendimento médico imediato.";
      causa = "Pode estar relacionada a emergências médicas agudas, crises convulsivas, hemorragias, insuficiência respiratória grave ou febre muito alta persistente.";
    }

    painel.innerHTML = `
      <strong>🤖 ANÁLISE PRELIMINAR DO SISTEMA</strong><br><br>
      • <strong>Classificação sugerida:</strong> ${classificacaoTexto}<br>
      • <strong>Probabilidade de risco/gravidade:</strong> ${porcentagem}<br>
      • <strong>Possível causa provável:</strong> ${causa}<br>
      • <strong>Explicação clínica:</strong> ${explicacao}<br>
      ${alergia ? "• <strong>Alergias relatadas:</strong> " + alergia + "<br>" : ""}
      ${observacao ? "• <strong>Observações:</strong> " + observacao + "<br>" : ""}
      <br><em>⚠️ Aviso: Esta análise automática é um suporte e não substitui a avaliação presencial do médico ou enfermeiro.</em>
    `;
  }, 400);
}

/* SALVAR TRIAGEM */

async function salvar() {
  const nome = document.getElementById("nome").value.trim();
  const sintoma = document.getElementById("sintoma").value;
  const temperaturaTexto = document.getElementById("temp").value;
  const alergia = document.getElementById("alergia").value.trim();
  const observacao = document.getElementById("observacao").value.trim();

  if (!nome) {
    alert("🧸 Digite o nome do paciente.");
    return;
  }

  if (!sintoma) {
    alert("🩺 Selecione o sintoma.");
    return;
  }

  let temperatura = null;
  if (temperaturaTexto !== "") {
    temperatura = Number(temperaturaTexto);
    if (!Number.isFinite(temperatura) || temperatura < 30 || temperatura > 45) {
      alert("Digite uma temperatura válida.");
      return;
    }
  }

  const risco = classificarRisco(sintoma, temperatura === null ? 0 : temperatura);

  try {
    const resposta = await fetch("/triagem", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nome,
        sintoma,
        temperatura,
        alergia,
        observacao,
        risco
      })
    });

    await lerResposta(resposta);

    const resultado = document.getElementById("resultado");
    resultado.className = risco;
    resultado.textContent = "Classificação preliminar: " + risco.toUpperCase();

    alert("✅ Triagem salva com sucesso!");

    document.getElementById("nome").value = "";
    document.getElementById("sintoma").value = "";
    document.getElementById("temp").value = "";
    document.getElementById("alergia").value = "";
    document.getElementById("observacao").value = "";

    document.getElementById("analise-ia").style.display = "none";
    document.getElementById("analise-ia").textContent = "";

    carregarPacientes();

  } catch (erro) {
    alert("❌ Não foi possível salvar: " + erro.message);
  }
}

/* INICIALIZAÇÃO */

carregarPacientes();
setInterval(carregarPacientes, 10000);
</script>
